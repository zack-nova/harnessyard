name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: "v1.3.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download modules
        run: go mod download

      - name: Check gofmt
        run: |
          set -euo pipefail

          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l -s)"
          if [ -n "$unformatted" ]; then
            echo "These .go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum
        run: |
          set -euo pipefail

          go mod tidy -diff
          go mod verify

      - name: Resolve golangci-lint version
        id: golangci_lint_version
        run: |
          set -euo pipefail

          version="$(sh ./scripts/read_mise_tool_version.sh golangci-lint)"
          echo "version=v${version}" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: ${{ steps.golangci_lint_version.outputs.version }}
          install-only: true

      - name: Run golangci-lint
        run: ./scripts/run_golangci_lint.sh

  go-tests:
    name: Go tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard:
          - hyard-cli
          - harness-cli
          - orbit-cli
          - orbit-template
          - orbit-harness
          - orbit-libraries

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download modules
        run: go mod download

      - name: Run Go test shard
        run: sh ./scripts/run_go_test_shard.sh "${{ matrix.shard }}"

      - name: Upload Go test timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-timing-${{ matrix.shard }}
          path: tmp/go-test-timing/${{ matrix.shard }}/
          if-no-files-found: error

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download modules
        run: go mod download

      - name: Install govulncheck
        run: |
          set -euo pipefail

          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...

  shell-validation:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download modules
        run: go mod download

      - name: Run shell validation
        run: sh ./scripts/test_shell_validation.sh
